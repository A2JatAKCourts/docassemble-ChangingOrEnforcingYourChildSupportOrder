template: court_to_enforce_step
subject: |
  Step ${ court_to_enforce_idx }: Ask the court to enforce your order
content: |
  % if user_need == 'enforce foreign order':
  Once you have registered your child support order, you can ask the Alaska court to enforce it.
  % endif
  <div class='step-subheading'>Option 1</div> 
  File a **Motion & Affidavit to Enforce Order** and ask the court to order the other parent to pay. Attach your written request and any response you got back. The court may hold a hearing and issue another order specifically telling the other side to pay by a specific date.
  
    **Motion & Affidavit to Enforce Order, DR-975**[[Fill in PDF](https://ak-courts.info/dr975)]
    
  <div class='step-subheading'>Option 2</div>
  File a **Motion & Affidavit to Reduce to Judgment**, asking the court to issue a judgment for the amount owed to you. Once you have a judgment, you can try to collect the amount by executing on the other parent's Permanent Fund Dividend, bank account, wages, etc.
  
    **Motion & Affidavit to Reduce to Judgment, DR-970** [[Fill in PDF](https://ak-courts.info/dr970)]
    
    **Worksheet to Figure Out Judgment Amount, SHC-1536** [Word](https://courts.alaska.gov/shc/family/docs/shc-1536.doc) | [PDF](https://courts.alaska.gov/shc/family/docs/shc-1536n.pdf)

  <div class='step-subheading'>For both options</div>

  You must also file a **Notice of Motion, CIV-650** [[Fill in PDF](https://ak-courts.info/civ650)] if the court issued the final order in your case and:

  * ${ other_party_in_case } was not represented by a lawyer, **or**
  * you are filing more than 1 year later.
  
  ${ signing_paragraph }
  
  <div class='step-subheading'>Read more about</div>
  
  [Enforcing Your Order](https://ak-courts.info/enforce)
  
  [Collecting money owed to you](https://courts.alaska.gov/shc/family/collectionsfaq.htm)
---

