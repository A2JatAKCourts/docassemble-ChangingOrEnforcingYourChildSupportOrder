template: ask_cssd_step
subject: |
  Step ${ ask_cssd_idx }: Ask CSED to change your child support
content: |
  A child support order from Alaska Child Support Enforcement Division (CSED) is called an administrative order.  CSED can change administrative orders.  This is called "modifying" child support.

  CSED can modify your order if:
  
    * The cost of your child's health insurance premium changes, or
    * Your income or the other parent's income changes so that a new child support calculation would be at least 15% more or 15% less than the payment you have now, or
    * Your children's schedule changes so that a new child support calculation would be at least 15% more or 15% less than the payment you have now.
 
  [Contact CSED](https://childsupport.alaska.gov/child-support-services/contact-us)
  <ul>
  <li>Customer Service Call Center:<br> 
  Monday - Thursday, 10:00 am - 3:00 pm
    <ul>
    <li>✆ Phone: (907) 269-6900, </li>
    <li>Toll Free (In-state): 800-478-3300 </li>
    </ul>
  </li>
  <li>⌨ Fax: (907) 787-3220 </li>
  <li>Email: <a href="mailto:dor.cssd.customerservice.anchorage@alaska.gov">dor.cssd.customerservice.anchorage@alaska.gov</a></li>
  </ul>
  <div class='step-subheading'>Timing</div>
  If your parenting schedule changes, or your income or the other parent's income changes, it is important to tell CSED **right away**.   
    * CSED cannot go back and change child support that was due in the past.   
    * Until you contact CSED, the old child support amount applies and the parent who owes child support still owes the old amount, even if income or the schedule has changed.
  
  <div class='step-subheading'>Read more about CSED </div>
     
    * [Modification FAQs](https://childsupport.alaska.gov/child-support-services/information/faqs/modifications-faq)   
    * [Modification Guidebook Brochure](https://childsupport.alaska.gov/docs/childsupportserviceslibraries/brochures/04-6204-a-modification-guidebook-09-2025.pdf)
---
