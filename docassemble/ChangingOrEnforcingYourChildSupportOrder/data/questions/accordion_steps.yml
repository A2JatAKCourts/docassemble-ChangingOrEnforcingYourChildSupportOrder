template: find_out_step
subject: |
  Step ${ find_out_idx }: Find out who issued your child support order
content: |
  <div class='step-subheading'>Contact CSED</div>
  [Contact CSED](https://childsupport.alaska.gov/child-support-services/contact-us) to ask if they issued your child support order.
  % if user_need == 'change AK order':
  If they did, they can give you information about changing it.  Changing an order is called “modifying” it.
  % elif user_need == 'enforce AK order':
  If they did, they can give you information about enforcing it.
  % endif
  <ul>
    <li>Customer Service Call Center:<br>
    Monday - Thursday, 10:00 am - 3:00 pm
      <ul>
        <li>✆ Phone: (907) 269-6900, </li>
        <li>Toll Free (In-state): 800-478-3300 </li>
      </ul>
    </li>
    <li>⌨ Fax: (907) 787-3220 </li>
    <li>Email: <a href="mailto:dor.cssd.customerservice.anchorage@alaska.gov">dor.cssd.customerservice.anchorage@alaska.gov</a></li>
  </ul>
  If CSED issued your order, see:
  <ul>
  % if user_need == 'change AK order':
  <li>
  <a href="https://childsupport.alaska.gov/child-support-services/information/faqs/modifications-faq">Modification FAQs</a></li>
  <li><a href="https://childsupport.alaska.gov/docs/childsupportserviceslibraries/brochures/04-6204-a-modification-guidebook-09-2025.pdf">Modification Guidebook Brochure</a></li>
  % elif  user_need == 'enforce AK order':
  <li>
  <a href="https://childsupport.alaska.gov/child-support-services/information/faqs/child-support-enforcement-services-faq">Child Support Enforcement FAQ</a></li>
  % endif
  <li><a href="https://childsupport.alaska.gov/child-support-services">Home page</a></li>
  </ul>
  <div class='step-subheading'>Contact the court</div>
  <p>Contact <a href="https://ak-courts.info/dir">your local court</a> or look on <a href="https://ak-courts.info/courtview">CourtView</a> to see if the court issued your child support order.</p>
  If the court issued your order:
  <ul>
  <li>Come back and build your <a href = "https://courtguide.akcourts.gov/start/ChangingEnforcingChildSupport/">Court Guide Action Plan</a> again, or</li>
  % if  user_need == 'enforce AK order':
  <li>Read <a href="https://ak-courts.info/enforce">Enforcing Your Order</a>.</li>
  </ul>
  % elif user_need == 'change AK order':
  <li>Read <a href="https://ak-courts.info/mtm">Modifying Child Custody or Child Support Order</a>.</li>
  </ul>
  <div class='step-subheading'>Changes</div>
    *	If your parenting schedule changes, or your income or the other parent's income changes, it is important to tell the court or CSED right away.  If CSED issued your order, tell CSED.  If the court issued your order, tell the court.
    * CSED and the court cannot go back and change child support that was due in the past.  They can only change child support starting when you file something asking to change it, and notify the other parent that you are asking for a change.
    * Until you tell CSED or the court, the old child support amount applies and the parent who owes child support still owes the old amount, even if income or the schedule has changed.
  % endif
---
