template: compare_child_support_step
subject: |
  Step ${ compare_child_support_idx }: Compare the new calculation with the current amount
content: |
  <div class='step-subheading'>Compare your current child support to the new amount to see if there is a "material change in circumstances."</div>
    If the new child support amount is 15% more or less than the old amount, the court presumes there is a "material change in circumstances."

  <div class = "example">
  <p class = "heading">For example</p>
  If our current child support amount is $100 per month, there would be a material change if the new amount is:
  <ul>
  <li>$85 or less, or</li>
  <li>$115 or more.</li>
  <ul>
  </div>
