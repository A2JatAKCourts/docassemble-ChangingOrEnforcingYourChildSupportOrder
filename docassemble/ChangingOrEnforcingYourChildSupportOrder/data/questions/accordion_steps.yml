template: talk_w_other_parent_step
subject: |
  Step ${ talk_w_other_parent_idx }: Talk to the other parent
content: |
  When the other parent is not following your child support order, you can ask the court to order them to follow it. It is a good idea to talk to the other parent first:
  
    * Ask the other parent in writing to do what the order says.
    * In your written request, give them a date to do it by.
    * Keep your writing polite and professional.  Remember the judge may see it.
    * Tell them if they do not do it you will ask the judge to enforce the order.
    * Keep a copy of your written request and any written response you get back.
    * Hopefully they will follow the order and you will not need to go back to court.
    * If the other parent still does not cooperate, let the court know by filing a motion. A motion is a form you file with the court asking the judge to order the other side to do something.
    * If you file a motion, attach a copy of what you wrote to the other parent and anything they responded.
--- 
